<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Полина Гусева</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0e0c">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <style>
    html, body { background: var(--bg); }
    body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: left; overflow-x: hidden; }
    .nf { width: 100%; max-width: 56rem; padding: var(--gutter); }
    .nf__title { font-family: var(--f-head); font-weight: 700; font-size: clamp(3.5rem, 2rem + 8vw, 8rem); line-height: 1; text-transform: uppercase; letter-spacing: 0.02em; }
    .nf__title span { color: var(--accent-text); }
    .nf__lead { margin: 1rem 0 0; color: var(--muted); max-width: 40rem; min-height: 3.2em; }
    .game { position: relative; margin-top: 1.5rem; border-top: 1px solid var(--line, #2a2c28); border-bottom: 1px solid var(--line, #2a2c28); touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer; }
    .game canvas { display: block; width: 100%; height: auto; }
    .game__hud { position: absolute; top: 0.6rem; left: 0.8rem; font-size: var(--fs-small); color: var(--muted); letter-spacing: 0.08em; pointer-events: none; }
    .game__msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 2.4rem; gap: 0.35rem; text-align: center; padding-left: 1rem; padding-right: 1rem; pointer-events: none; font-size: var(--fs-small); letter-spacing: 0.06em; color: var(--text); text-transform: uppercase; }
    .game__msg small { color: var(--muted); text-transform: none; letter-spacing: 0.02em; font-size: var(--fs-small); }
    .nf__row { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 1.5rem; margin-top: 1.5rem; }
    .nf__hint { color: var(--muted); font-size: var(--fs-small); }
    @media (max-width: 599px) { .nf__row .btn { width: 100%; } }
  </style>
</head>
<body>
  <main class="nf">
    <h1 class="nf__title">4<span>0</span>4</h1>
    <p class="nf__lead" id="lead">Такой страницы нет. Возможно, она переехала или в адресе опечатка. Пока ищем, поможем смайлику добежать до неё.</p>

    <div class="game" id="game" role="application" aria-label="Мини-игра: смайлик перепрыгивает цифры. Прыжок: пробел, стрелка вверх или касание экрана">
      <canvas id="cv" width="720" height="200"></canvas>
      <div class="game__hud" id="hud">00000</div>
      <div class="game__msg" id="msg">Нажмите пробел или коснитесь экрана<small>смайлик побежит, а вы перепрыгивайте цифры</small></div>
    </div>

    <div class="nf__row">
      <a class="btn" href="/"><span class="btn__label">На главную</span></a>
      <span class="nf__hint">Прыжок: пробел, ↑ или касание</span>
    </div>
  </main>

  <script>
  (function () {
    var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
    var hud = document.getElementById('hud'), msg = document.getElementById('msg'), lead = document.getElementById('lead');
    var game = document.getElementById('game');
    var W = game.clientWidth < 600 ? 360 : 720, H = 200, GROUND = 168, CELL = game.clientWidth < 600 ? 6 : 5;
    var SPEEDK = W < 720 ? 0.8 : 1;
    cv.style.aspectRatio = W + ' / ' + H;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

    var css = getComputedStyle(document.documentElement);
    function tok(n, d) { var v = css.getPropertyValue(n).trim(); return v || d; }
    var C = { text: tok('--text', '#ececE9'), muted: tok('--muted', '#8a8c86'), accent: tok('--accent-text', '#3f9669'), line: '#2a2c28' };

    /* Пиксельные рисунки: смайлик 7×5 и цифры 3×5 */
    var SMILE = ['.X...X.', '.X...X.', '.......', 'X.....X', '.XXXXX.'];
    var GLYPH = {
      '4': ['X.X', 'X.X', 'XXX', '..X', '..X'],
      '0': ['XXX', 'X.X', 'X.X', 'X.X', 'XXX']
    };
    function px(rows, x, y, cell, color) {
      ctx.fillStyle = color;
      for (var r = 0; r < rows.length; r++) {
        for (var c = 0; c < rows[r].length; c++) {
          if (rows[r][c] === 'X') { ctx.fillRect(Math.round(x + c * cell), Math.round(y + r * cell), cell, cell); }
        }
      }
    }

    var JOKES = [
      'Страница ушла за хлебом.',
      'Она точно была где-то здесь.',
      'Ищем в соседней вкладке…',
      'Кажется, её съел баг.',
      'Не бегите так быстро, она стесняется.',
      'Страница уехала в отпуск без предупреждения.',
      'Сайт работает, а эта страница нет. Бывает.',
      'Цифры злятся, потому что их три.'
    ];
    var DEAD = ['Врезались в ошибку.', 'Ой, четвёрка оказалась крепкой.', 'Ноль не пропустил.', 'Классика: 404 побеждает.'];

    var best = 0;
    try { best = +localStorage.getItem('nf-best') || 0; } catch (e) {}

    var st, raf, last;
    function reset() {
      st = { state: 'idle', t: 0, score: 0, speed: 300, y: 0, vy: 0, obs: [], nextGap: 0.9, jokeAt: 0 };
    }
    reset();

    var player = { w: 7 * CELL, h: 5 * CELL };
    function onGround() { return st.y === 0; }
    function jump() {
      if (st.state === 'idle' || st.state === 'dead') { start(); return; }
      if (onGround()) { st.vy = 780; }
    }
    function start() {
      reset(); st.state = 'run';
      msg.style.display = 'none';
      lead.textContent = JOKES[Math.floor(Math.random() * JOKES.length)];
      last = performance.now();
      cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
    }
    function die() {
      st.state = 'dead';
      var sc = Math.floor(st.score);
      if (sc > best) { best = sc; try { localStorage.setItem('nf-best', String(best)); } catch (e) {} }
      msg.style.display = 'flex';
      msg.innerHTML = DEAD[Math.floor(Math.random() * DEAD.length)] + '<small>' + sc + ' м · рекорд ' + best + ' м. Тап или пробел: ещё раз</small>';
    }

    function spawn() {
      var kinds = ['4', '0', '40', '04'];
      var k = kinds[Math.floor(Math.random() * kinds.length)];
      var cell = 5 + Math.floor(Math.random() * 2);
      var w = k.length * 3 * cell + (k.length - 1) * cell;
      st.obs.push({ k: k, x: W + 20, w: w, h: 5 * cell, cell: cell });
    }

    function update(dt) {
      st.t += dt;
      st.speed = Math.min(300 + st.t * 14, 720) * SPEEDK;
      st.score += dt * st.speed / 40;
      /* прыжок */
      if (st.y > 0 || st.vy > 0) {
        st.vy -= 2300 * dt;
        st.y += st.vy * dt;
        if (st.y <= 0) { st.y = 0; st.vy = 0; }
      }
      /* препятствия */
      st.nextGap -= dt;
      if (st.nextGap <= 0) { spawn(); st.nextGap = 0.85 + Math.random() * 0.9 + 260 / st.speed * 0.3; }
      st.obs.forEach(function (o) { o.x -= st.speed * dt; });
      st.obs = st.obs.filter(function (o) { return o.x + o.w > -10; });
      /* шутки по ходу */
      if (Math.floor(st.score / 150) > st.jokeAt) {
        st.jokeAt = Math.floor(st.score / 150);
        lead.textContent = JOKES[Math.floor(Math.random() * JOKES.length)];
      }
      /* столкновения */
      var px0 = 40 + 4, pw = player.w - 8, ph = player.h - 4, pyTop = GROUND - st.y - player.h + 2;
      for (var i = 0; i < st.obs.length; i++) {
        var o = st.obs[i], oy = GROUND - o.h;
        if (px0 < o.x + o.w - 3 && px0 + pw > o.x + 3 && pyTop < GROUND && pyTop + ph > oy + 3) { die(); return; }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      /* земля */
      ctx.fillStyle = C.line; ctx.fillRect(0, GROUND, W, 1);
      var off = st.state === 'run' ? (st.t * st.speed) % 24 : 0;
      ctx.fillStyle = C.muted;
      for (var x = -off; x < W; x += 24) { ctx.fillRect(Math.round(x), GROUND + 6, 8, 2); }
      /* препятствия */
      st.obs.forEach(function (o) {
        for (var i = 0; i < o.k.length; i++) {
          px(GLYPH[o.k[i]], o.x + i * (3 * o.cell + o.cell), GROUND - o.h, o.cell, C.accent);
        }
      });
      /* смайлик, при беге чуть подпрыгивает ножками */
      var bob = (st.state === 'run' && onGround()) ? (Math.floor(st.t * 10) % 2) * 2 : 0;
      px(SMILE, 40, GROUND - player.h - st.y - bob, CELL, st.state === 'dead' ? C.muted : C.text);
      hud.textContent = String(Math.floor(st.score)).padStart(5, '0') + (best ? '  HI ' + String(best).padStart(5, '0') : '');
    }

    function loop(now) {
      var dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (st.state === 'run') { update(dt); }
      draw();
      if (st.state === 'run') { raf = requestAnimationFrame(loop); }
    }
    draw();

    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        if (e.target && /^(A|BUTTON)$/.test(e.target.tagName) && e.code === 'Space') { return; }
        e.preventDefault(); jump();
      }
    });
    game.addEventListener('pointerdown', function (e) { e.preventDefault(); jump(); });
  })();
  </script>
</body>
</html>
